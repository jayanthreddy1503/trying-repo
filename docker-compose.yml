services:
  db:
    image: mysql:8.0
    container_name: wardrobe_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: jayanth
      MYSQL_DATABASE: wardrobe_manager
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wardrobe_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=jayanth
      - DB_NAME=wardrobe_manager
      - PORT=5000
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    container_name: wardrobe_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  db_data: